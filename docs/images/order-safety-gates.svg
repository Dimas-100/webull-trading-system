<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" width="1000" height="632" role="img" aria-labelledby="ti de">
<title id="ti">Order safety gates</title>
<desc id="de">Three entry paths converge on validate_order and should_submit; dry run by default.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect width="1000" height="632" rx="12" fill="#0d1117"/>
<text x="30" y="44" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#e6edf3" font-weight="700" text-anchor="start">How an order reaches real money</text>
<text x="30" y="68" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b949e" font-weight="normal" text-anchor="start">Three ways in, one way out. Nothing is submitted unless confirm=True survives every wall.</text>
<text x="30" y="104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#58a6ff" font-weight="700" text-anchor="start" letter-spacing="1.5">WHO CAN ASK</text>
<rect x="30" y="116" width="290" height="100" rx="8" fill="#161b22" stroke="#30363d"/>
<rect x="30" y="116" width="4" height="100" rx="2" fill="#58a6ff"/>
<text x="48" y="143" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="start">You, at the terminal</text>
<text x="48" y="163" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="12" fill="#58a6ff" font-weight="normal" text-anchor="start">scripts/place_order.py</text>
<text x="48" y="182" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">Pass --confirm, then type</text>
<text x="48" y="200" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">CONFIRM at the prompt</text>
<path d="M175,218 L175,264" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="355" y="116" width="290" height="100" rx="8" fill="#161b22" stroke="#30363d"/>
<rect x="355" y="116" width="4" height="100" rx="2" fill="#58a6ff"/>
<text x="373" y="143" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="start">Claude Desktop (codeword)</text>
<text x="373" y="163" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="12" fill="#58a6ff" font-weight="normal" text-anchor="start">webull_trade_mcp  place_order</text>
<text x="373" y="182" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">A codeword only you know, then</text>
<text x="373" y="200" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">a per-order dollar cap</text>
<path d="M500,218 L500,264" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="680" y="116" width="290" height="100" rx="8" fill="#161b22" stroke="#30363d"/>
<rect x="680" y="116" width="4" height="100" rx="2" fill="#d29922"/>
<text x="698" y="143" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="start">Autopilot (unattended)</text>
<text x="698" y="163" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="12" fill="#d29922" font-weight="normal" text-anchor="start">webull_api/autopilot/gate.py</text>
<text x="698" y="182" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">Enable flag, kill switch, caps,</text>
<text x="698" y="200" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">SPY regime. OFF by default</text>
<path d="M825,218 L825,264" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="30" y="268" width="940" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
<rect x="30" y="268" width="4" height="70" rx="2" fill="#3fb950"/>
<text x="48" y="296" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="start">1 · Validate</text>
<text x="150" y="296" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="12.5" fill="#3fb950" font-weight="normal" text-anchor="start">safety.validate_order</text>
<text x="48" y="320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">Pure, no network: side, quantity &gt; 0, order type, limit price within a deviation guard of the last price.</text>
<path d="M500,340 L500,366" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="30" y="370" width="940" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
<rect x="30" y="370" width="4" height="70" rx="2" fill="#3fb950"/>
<text x="48" y="398" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="start">2 · The submit gate</text>
<text x="205" y="398" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="12.5" fill="#3fb950" font-weight="normal" text-anchor="start">safety.should_submit(confirm)</text>
<text x="48" y="422" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">Returns bool(confirm) and nothing else. This gate is never weakened; new features only add walls in front of it.</text>
<path d="M255,442 L255,476" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M745,442 L745,476" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="267" y="463" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="12" fill="#8b949e" font-weight="normal" text-anchor="start">confirm=False  (the default)</text>
<text x="757" y="463" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="12" fill="#8b949e" font-weight="normal" text-anchor="start">confirm=True</text>
<rect x="30" y="480" width="450" height="100" rx="8" fill="#161b22" stroke="#30363d"/>
<rect x="30" y="480" width="4" height="100" rx="2" fill="#3fb950"/>
<text x="48" y="507" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="start">Dry run: nothing is submitted</text>
<text x="48" y="527" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="12" fill="#3fb950" font-weight="normal" text-anchor="start">trading.place -&gt; preview_order</text>
<text x="48" y="546" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">Prints the preview and Webull's server-side validation,</text>
<text x="48" y="564" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">then stops. Always safe to run</text>
<rect x="520" y="480" width="450" height="100" rx="8" fill="#161b22" stroke="#30363d"/>
<rect x="520" y="480" width="4" height="100" rx="2" fill="#f85149"/>
<text x="538" y="507" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="start">Live order: REAL MONEY</text>
<text x="538" y="527" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="12" fill="#f85149" font-weight="normal" text-anchor="start">trading.place -&gt; place_order (prod)</text>
<text x="538" y="546" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">A developer key is production-only, so every submit</text>
<text x="538" y="564" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">is real. There is no test environment to hide behind</text>
<text x="30" y="612" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" font-weight="normal" text-anchor="start">trading.py is the only module that can place, modify or cancel. Source-guard tests prove the rest is place-free.</text>
</svg>
