<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 708" width="1000" height="708" role="img" aria-labelledby="ti de">
<title id="ti">Daily timeline</title>
<desc id="de">Scheduled runs from the 09:30 open to the 21:00 dead-man deadline.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect width="1000" height="708" rx="12" fill="#0d1117"/>
