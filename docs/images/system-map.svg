<text x="30" y="694" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" font-weight="normal" text-anchor="start">Green and amber lanes are the live money path. Blue reads only. Purple never touches the broker.</text>
